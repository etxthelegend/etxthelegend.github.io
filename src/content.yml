  - slug: truck-tracker
    title: Roadside Vehicle Tracker
    subtitle: Fine-tuned YOLO for matching vehicles to exhaust plumes
    category: personal
    year: 2026
    org: Side project · supporting UBC plume research
    tags: [Python, YOLO, Computer vision]
    featured: false
    cover: img/truck-tracker-detection.jpg
    summary: >
      A vehicle detector and tracker for roadside video, built on Ultralytics YOLO with my own
      fine-tuned model, that logs vehicle passes so they can be matched to measured exhaust plumes.
    sections:
      - heading: What it does
        body: >
          Detects and tracks trucks and cars in roadside video and outputs time-stamped vehicle
          passes. A UBC researcher matches those passes against plume measurements to attribute
          emissions to individual vehicles.
      - heading: How it counts
        body: >
          Each detected vehicle gets a track ID. Two counting lines across the road record when
          a track crosses them and in which direction, so the output separates trucks from cars and
          left-to-right from right-to-left traffic, with a timestamp for every pass.
      - heading: Status
        body: In progress.
    images:
