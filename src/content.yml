projects:
  - slug: carbosamy
    title: CarboSAMY
    subtitle: Automated deep-learning segmentation of soot in TEM images
    category: research
    year: 2026
    org: UBC Energy & Aerosol Laboratory
    tags: [Python, Deep learning, Image processing, TEM]
    featured: true
    cover: img/carbosamy-tem-soot.jpg
    summary: >
      A deep-learning workflow that finds, segments, and measures soot and other carbonaceous
      particles in electron-microscope images, reducing analysis time by 99.6%.
    sections:
      - heading: Why
        body: >
          Transmission electron microscopy (TEM) is the standard way to see the structure of soot
          aggregates, but measuring them means hand-tracing particles image by image. That slow,
          subjective step limits how much data a study can use.
      - heading: What I built
        body: >
          CarboSAMY is an end-to-end workflow that detects particles, segments them, and extracts
          morphology metrics automatically. It uses two models: CarboSAM-seg for segmentation and
          CarboSAM-pp for post-processing. Compared with manual analysis it cuts analysis time by
          99.6%.
      - heading: Validation
        body: >
          I coordinated a small annotation team producing manually segmented images as validation
          data, reviewing consistency, particle identification, and mask quality.
      - heading: Status
        body: >
          Manuscript submitted. Results were also presented as a poster at the Canadian Aerosol
          Conference (2026).
    images:
      - { src: img/carbosamy-workflow.jpg, fit: contain, caption: "Inference workflow. YOLO finds and classifies particles, and its boxes prompt CarboSAM to produce masks at (a) the aggregate level and (b) the primary-particle level." }
      - { src: img/carbosamy-tem-soot.jpg, caption: "A soot aggregate imaged by transmission electron microscopy." }
      - { src: img/carbosamy-primary-particles.jpg, caption: "CarboSAMY-pp detecting individual primary particles inside aggregates." }
      - { src: img/carbosamy-architecture.jpg, fit: contain, caption: "Architecture: a µSAM model fine-tuned on TEM masks (top), prompted by a YOLO detector (bottom)." }
      - { src: img/carbosamy-segmentation-comparison.jpg, fit: contain, caption: "Segmentation of wildfire, laboratory, and lacey-grid soot: CarboSAMY compared with Carboseg and k-means." }
      - { src: img/carbosamy-parity.jpg, fit: contain, caption: "Aggregate diameter against manual measurement: CarboSAMY tracks the 1:1 line with under 1% bias." }
      - { src: img/carbosamy-pp-comparison.jpg, fit: contain, caption: "Primary-particle detections from manual analysis, CHT, SAGE, and CarboSAMY-pp on the same images." }

  - slug: thermophoretic-sampler
    title: Thermophoretic Sampler
    subtitle: Experimental and computational validation of a TEM grid sampler
    category: research
    year: 2026–27
    org: MECH 493 thesis project · UBC Energy & Aerosol Laboratory
    tags: [OpenFOAM, CFD, SMPS, Spark-discharge aerosol, TEM, Arduino]
    featured: false
    cover: img/tps-tem-1.jpg
    summary: >
      Testing the UBC thermophoretic sampler against a known aerosol and an OpenFOAM model, as
      the first step toward a package that collects several TEM samples during one UAV flight.
    sections:
      - heading: Why
        body: >
          TEM is one of the most direct ways to see the shape of soot, but the particles first
          have to land on a TEM grid. A thermophoretic sampler (TPS) does this with a temperature
          gradient: a heated jet of aerosol hits a cool grid, and small particles drift from hot gas
          toward the cold surface. Aircraft and drones can sample where people can't reach, but one
          grid exposed for a whole flight gives one blended sample. I'm working toward a package
          that collects at least five separate samples in a single flight.
      - heading: Experiment
        body: >
          A Palas GFG 1000 spark-discharge generator produces a controlled aerosol. A scanning
          mobility particle sizer (SMPS) measures its size distribution and concentration as the
          reference, and the sampler collects particles onto a TEM grid for a known flow rate and
          time. The grids are imaged, and the particles will be counted with CarboSAMY. In the first
          runs the SMPS measured about 1.1 × 10⁷ particles/cm³ with a geometric mean diameter
          of 24.5 nm.
      - heading: First results
        body: >
          10- and 20-minute samples collected plenty of aggregates on lacey carbon grids. The
          deposit is not uniform across the grid, though, so counting particles on the grid alone
          can't give a reliable collection efficiency. The next tests will put the SMPS on the
          sampler's exhaust as well and compare inlet and outlet concentrations.
      - heading: CFD model
        body: >
          I built an OpenFOAM model of the heated nozzle and grid region (0.70 mm tube, exit
          3.67 mm above the grid) to solve the flow and temperature fields. Its nozzle-exit speed
          and temperature profiles match an ANSYS Fluent reference. I then track 50 nm soot
          particles through the jet to see where and why they deposit, and compare flow rates such
          as 0.1 and 0.5 L/min.
      - heading: Next steps
        list:
          - Compare CFD deposition with the measured collection efficiency
          - Vary flow rate, heater temperature, and jet-to-grid spacing in both model and experiment
          - Design and prototype a multi-grid package for UAV sampling
    images:
      - { src: img/tps-cfd-flow-rate.jpg, fit: contain, caption: "OpenFOAM velocity and temperature fields for the heated jet hitting the grid at 0.1 and 0.5 L/min." }
      - { src: img/tps-setup.jpg, caption: "Test setup: spark-discharge generator, SMPS, and the sampler with its control box." }
      - { src: img/tps-smps.jpg, caption: "SMPS size distribution of the generated aerosol, used as the reference." }
      - { src: img/tps-tem-1.jpg, caption: "TEM image of spark-generated aggregates collected by the sampler on a lacey carbon grid." }
      - { src: img/tps-tem-2.jpg, caption: "Another region of the same grid." }
      - { src: img/tps-controller.jpg, caption: "The sampler's control box on the bench supply." }
      - { src: img/tps-controller-panel.jpg, caption: "Front panel with an OLED sampling timer and push-button controls." }
      - { src: img/tps-cfd-particles.mp4, poster: img/tps-cfd-particles-poster.jpg, fit: contain, caption: "OpenFOAM particle tracking: 50 nm soot tracers carried by the jet onto the grid (dots enlarged for visibility)." }
      - { src: img/tps-cfd-fluent-validation.jpg, fit: contain, caption: "Nozzle-exit speed and temperature profiles: OpenFOAM against the ANSYS Fluent reference." }

  - slug: smart-brake-chamber
    title: Smart Brake Chamber
    subtitle: Anti-theft caging-port protection for trailer air brakes
    category: design
    year: 2025–26
    org: Capstone Team 12, BrakeIn Security · sponsored by Level5Fleet
    tags: [SolidWorks, Rapid prototyping, FEA, Tolerance analysis, Mechatronics]
    featured: true
    cover: img/sbc-workbench.jpg
    summary: >
      A motorized locking device that keeps thieves from releasing a trailer's parking brakes
      through the caging port, while staying quick to remove for authorized maintenance.
    sections:
      - heading: Problem
        body: >
          Trailer theft costs the trucking industry millions every year. A common method defeats
          the air-brake system by pressurizing the spring brake chamber or reaching the caging port
          to mechanically release the parking brakes. Our system targets three attack paths:
          pressurizing the supply line, uncontrolled venting, and access to the caging port.
          My work focused on the caging port.
      - heading: Requirements
        list:
          - Block direct access to the caging port in normal operation
          - Survive at least 10 minutes of angle grinding and drilling
          - Unlock and come off quickly for authorized service
          - Fit existing brake chambers without modifying their internals
          - Stay cheap enough for fleet-wide deployment
      - heading: Design
        body: >
          I produced 10+ SolidWorks iterations and settled on a two-part interlocking housing that
          blocks any straight-line path to the port, with a servo-driven automatic lock for early
          functional testing. I built complete drawing sets, including exploded assemblies and
          detail drawings for every custom part, and ran tolerance stack-ups and FEA to check fit,
          manufacturability, and strength of critical components.
      - heading: Testing
        body: >
          Early 3D-printed prototypes with motors and actuators were mounted on a brake-chamber
          mock-up and cycled through repeated lock/unlock tests, then the design moved to full
          prototype chambers powered from a 12 V supply. The device locked and unlocked reliably,
          fully covered the port, and met 100% of its functional tests, with minor alignment
          refinements identified.
      - heading: Showcase
        body: >
          The team presented the final design and working prototype at the UBC capstone showcase.
      - heading: Next steps
        list:
          - Metal prototype in hardened steel
          - Standardized 10-minute tamper tests
          - Integrate with supply-line protection and venting control
    images:
      - { src: img/sbc-showcase.jpg, caption: "Team 12 (BrakeIn Security) with the final prototype and poster at the UBC capstone showcase." }
      - { src: img/sbc-workbench.jpg, caption: "Assembling and bench-powering the prototype brake chambers from a 12 V supply." }
      - { src: img/sbc-lock-test.mp4, poster: img/sbc-lock-test-poster.jpg, caption: "Bench test of the electric lock on its mounting plate." }
      - { src: img/sbc-port-lock.mp4, poster: img/sbc-port-lock-poster.jpg, caption: "The caging-port lock actuating inside the assembled chamber." }

  - slug: piv
    title: Particle Image Velocimetry over an Airfoil
    subtitle: Measuring flow separation and circulation on a NACA 0012
    category: analysis
    year: 2025
    org: UBC Mechanical Engineering
    tags: [PIV, Experimental fluids, Aerodynamics]
    featured: true
    cover: "https://framerusercontent.com/images/TUUhlSXftG9a8mjzvsinC1qG0.png"
    summary: >
      PIV in a recirculating water channel to map the flow around a NACA 0012 from ~1° to ~38°
      angle of attack, and estimate lift from circulation.
    sections:
      - heading: Motivation
        body: >
          How flow behaves around an airfoil decides lift, stall, and wake development. PIV lets us
          see separation and vortex formation directly and also put numbers on them: integrating
          vorticity gives circulation, a proxy for lift.
      - heading: Goals
        list:
          - Measure velocity fields at angles of attack from about 1.3° to 37.7°
          - Compute vorticity and circulation as a lift proxy
          - Compare laminar and jet inflow conditions
          - Observe separation and wake growth as angle of attack increases
      - heading: Setup
        body: >
          A 48-inch acrylic recirculating water trough, seeded with coffee grounds and lit from
          below by a lightboard. Perforated screens and an inverted-V baffle conditioned the inflow,
          and a Nikon D750 recorded particle motion for each test condition.
      - heading: Results
        list:
          - Captured attached, transitional, and fully separated flow
          - Wake grew with angle of attack, as expected
          - Circulation increased with angle of attack, consistent with aerodynamic theory
      - heading: Error sources
        body: >
          Non-uniform inflow from the trough design, seed particles avoiding the free surface,
          ripples and optical distortion, large seed particles limiting resolution, and blockage
          near the airfoil.
    images:
      - { src: "https://framerusercontent.com/images/TUUhlSXftG9a8mjzvsinC1qG0.png", caption: "" }
      - { src: "https://framerusercontent.com/images/QMJNuFBhCEaLTJkuGlTx01qNDU.png", caption: "" }
      - { src: "https://framerusercontent.com/images/qnAsX3ECOH3sLoxx7LVNDeT54Y.png", caption: "" }
