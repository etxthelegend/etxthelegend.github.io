  - slug: les-sgs-review
    title: LES Subgrid-Scale Model Review
    subtitle: Eddy-viscosity closures for wall-bounded turbulence
    category: analysis
    year: 2026
    org: MECH 586 · Turbulent Shear Flow
    tags: [Turbulence, LES, CFD]
    featured: false
    cover: img/wale-review-page1.jpg
    links:
      - { label: Read the review (PDF), url: files/Xiong_WALE_SGS_review.pdf }
    summary: >
      A technical review comparing Smagorinsky, dynamic Smagorinsky, WALE, Vreman, and Sigma
      models, with a focus on WALE for wall-bounded flows.
    sections:
      - heading: Scope
        body: >
          Compared the assumptions behind five eddy-viscosity closures for large-eddy simulation:
          Smagorinsky, dynamic Smagorinsky, WALE, Vreman, and Sigma.
      - heading: Focus
        body: >
          Evaluated near-wall scaling, sensitivity to strain and rotation rates, and suitability
          for wall-bounded turbulent shear flows, with an emphasis on the WALE model.
      - heading: Findings
        body: >
          WALE uses the square of the resolved velocity-gradient tensor, so it responds to both
          strain and rotation and recovers the correct cubic near-wall scaling of eddy viscosity
          without a damping function. Its weaknesses are a fixed model constant, a non-zero response
          in solid-body rotation, and less consistent behaviour in some under-resolved simulations.
          Those weaknesses motivated dynamic WALE formulations and the σ-model. WALE is not
          universally optimal, but it remains a useful model and the basis for later wall-adapting
          closures.
    images: []

